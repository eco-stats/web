  description: Ben is an ecological statistician and data scientist with research at the intersection of statistics, artificial intelligence, and ecology, with a focus on developing methods that help ecologists monitor, assess and protect the natural environment. Ben works particularly with remote underwater video, ecological abundance data and multivariate study design.

- name: Jakub Stoklosa
  photo: Jakub_Stoklosa.png
  info: Senior Lecturer
  email: j.stoklosan@unsw.edu.au
  website: https://www.unsw.edu.au/staff/jakub-stoklosa
  description: Dr Jakub Stoklosa is a Senior Lecturer in the School of Mathematics and Statistics. He is a member of the Evolution & Ecology Research Centre and the Eco-Stats group within the School of Mathematics and Statistics. His current research interests include: Analysis of capture-recapture data. Estimation of animal abundance. Measurement error modelling.
