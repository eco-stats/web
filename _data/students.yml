  description: Grace Davenport is a PhD student in Mathematics and Statistics at the UNSW. Her research lies at the intersection of data science and conservation, specifically applying machine learning methods to species distribution modeling. She aims to leverage her background in biology and statistics to help answer some of our world's most pressing ecological questions.

